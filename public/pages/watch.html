<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/styles/base/reset.css">
    <link rel="stylesheet" href="/styles/base/variables.css">
    <link rel="stylesheet" href="/styles/layouts/header.css">
    <link rel="stylesheet" href="/styles/layouts/home.css">
    <link rel="stylesheet" href="/styles/layouts/serie.css">
    <link rel="stylesheet" href="/styles/layouts/episodio.css">
    <link rel="stylesheet" href="/styles/layouts/footer.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bangers&family=Creepster&family=Spectral:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap"
        rel="stylesheet">
    <link rel="shortcut icon" href="/images/clapperboard-solid.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <title>Rari-Caturas</title>
</head>

<body>
    <header>
        <div class="titulo-logo-main">
            <div class="ctn-titulo">
                <a href="/" class="nombre-pagina">RARI-CATURAS TV</a>
            </div>
            <div>
                <button class="btn-nav" title="navbar" type="button" id="btn-nav"><i
                        class="fa-solid fa-bars icono-nav"></i></button>
            </div>
        </div>

        <div class="nav-principal" id="ctn-navbar">

            <a href="/" class="activo nav-links">Inicio</a>
            <a href="/proximamente" class="nav-links">Proximamente</a>
            <a href="#" class="nav-links">Adult Swim</a>
            <a href="#" class="nav-links">FAQ</a>
        </div>
    </header>

    <main class="contenedor-serie">
        <div class="contenedor-banner">
            <div class="descripcion-serie">
                <div class="logo-serie">
                </div>
                <div class="info-serie">
                </div>
                <div class="ctn-temporadas">
                    <button class="btn-temporadas" type="button">Temporadas <i
                            class="fa-solid fa-angle-down"></i></button>
                    <div class="nav-temporadas">
                    </div>
                </div>
                <div class="ctn-descarga">
                    <button class="btn-informacion" id="openModal"><i
                            class="fa-solid fa-circle-info"></i>Información</button>
                    <dialog class="modal-info" id="mainModal">
                        <div class="titulo-info">
                            <h2>Información</h2>
                        </div>
                        <div class="informacion-descarga">
                            <!--Modificar esto con flex-->
                            <div class="serie-info">
                                <h3 class="dato">Resolución:</h3>
                                <h3 class="dato">Idioma:</h3>
                                <h3 class="dato">Subtitulos:</h3>
                                <h3 class="dato">Peso x episodio:</h3>
                            </div>
                            <div class="serie-info-datos">
                            </div>
                        </div>
                        <button class="btn-cerrar" id="closeModal">Cerrar</button>
                    </dialog>
                    <button class="btn-descargar" id="modal-descargar"><i class="fa-solid fa-circle-down"></i></button>
                    <dialog class="modalInfo" id="mainModalDescarga">
                        <div class="titulo-info">
                            <h2>Opciones de descarga</h2>
                        </div>
                        <div class="contenedor-descargas">
                        </div>
                        <button class="btn-cerrar" id="closeModalD">Cerrar</button>
                    </dialog>
                </div>
            </div>
        </div>
        <div class="contenedor-episodios">
            <h3 class="fuente">Episodios</h3>
            <div class="flex-episodios">
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/dc6efa34d2.js" crossorigin="anonymous"></script>
    <script src="/scripts/temporada.js"></script>
    <script src="/scripts/modal.js"></script>
    <script src="/scripts/serieWatch.js" type="module"></script>
</body>

</html>
